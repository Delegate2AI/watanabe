<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- watanabe favicon: slab-serif W in paper white on the portal's terracotta accent -->
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d97757"/>
      <stop offset="1" stop-color="#c96442"/>
    </linearGradient>
  </defs>
  <rect width="32" height="32" rx="7" fill="url(#tile)"/>
  <g fill="#faf9f6">
    <!-- top serifs -->
    <rect x="4.9" y="9.5" width="5.2" height="1.2"/>
    <rect x="22.9" y="9.5" width="3.6" height="1.2"/>
    <!-- thick downstroke 1 -->
    <polygon points="5.9,9.5 9.1,9.5 13.9,23.5 10.7,23.5"/>
    <!-- thin upstroke 1 -->
    <polygon points="11.6,23.5 13.0,23.5 16.9,10.2 15.5,10.2"/>
    <!-- thick downstroke 2 -->
    <polygon points="14.6,10.2 17.8,10.2 21.7,23.5 18.5,23.5"/>
    <!-- thin upstroke 2 -->
    <polygon points="19.4,23.5 20.8,23.5 25.4,9.5 24.0,9.5"/>
  </g>
</svg>
